<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis reportes · EcoAlerta</title><link rel="stylesheet" href="css/style.css"></head>
<body><a class="skip" href="#c">Saltar al contenido</a><header id="cab"></header><main id="c" class="w">
<h1>Mis reportes</h1><div id="l"></div>
<h2>Cambiar contraseña</h2>
<form id="f" class="card" style="max-width:420px"><label>Contraseña actual<input type="password" name="old" autocomplete="current-password" required></label><label>Nueva contraseña (mínimo 8)<input type="password" name="new" minlength="8" autocomplete="new-password" required></label><button class="btn">Guardar contraseña</button></form>
</main><footer id="pie"></footer>
<script src="js/app.js"></script>
<script>ready.then(async me=>{if(!me)return location='login.html';
try{const r=(await api('api/reports.php?mine=1')).reports;if(!r.length)$('#l').append(el('p',{class:'empty',text:'Aún no has enviado reportes.'}));
r.forEach(x=>$('#l').append(el('p',{},x.icon+' ',el('a',{href:'reporte.html?id='+x.id,text:x.title}),' ',badge(x.status))))}catch(e){flash(e.message,'err')}
$('#f').onsubmit=async e=>{e.preventDefault();try{await api('api/auth.php?a=password',{json:Object.fromEntries(new FormData(e.target))});e.target.reset();flash('Contraseña actualizada.')}catch(x){flash(x.message,'err')}}});</script></body></html>
