<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actividades · EcoAlerta</title><link rel="stylesheet" href="css/style.css"></head>
<body><a class="skip" href="#c">Saltar al contenido</a><header id="cab"></header><main id="c" class="w">
<h1>Acciones comunitarias</h1><div id="l"></div><div id="nuevo"></div>
<script src="js/app.js"></script>
<script>ready.then(async me=>{async function lista(){const L=$('#l');try{const a=(await api('api/extra.php?a=activities')).activities;L.replaceChildren();if(!a.length)L.append(el('p',{class:'empty',text:'No hay actividades publicadas todavía.'}));
a.forEach(x=>{const c=el('div',{class:'card'},el('h2',{text:x.title}),el('p',{text:x.description}),el('p',{text:'📅 '+x.event_date+' · 📍 '+x.location+' · Organiza: '+x.organizer}),el('p',{text:'Cómo participar: '+x.how_to+' · '+x.n+' inscritos'}));
if(me){const b=el('button',{class:'btn sm',text:+x.mine?'Cancelar participación':'Quiero participar'});b.onclick=async()=>{try{await api('api/extra.php?a=join',{json:{id:x.id}});lista()}catch(e){flash(e.message,'err')}};c.append(b)}else c.append(el('a',{href:'login.html',text:'Ingresa para participar'}));L.append(c)})}catch(e){flash(e.message,'err')}}
lista();if(me&&me.role!=='ciudadano'){const f=el('form',{class:'card'},el('h2',{text:'Publicar actividad'}),
...[['title','Título','text'],['description','Descripción','text'],['event_date','Fecha y hora','datetime-local'],['location','Lugar','text'],['organizer','Organizador','text'],['how_to','Forma de participación','text']].map(([n,t,y])=>el('label',{},t,el('input',{name:n,type:y,required:''}))),el('button',{class:'btn',text:'Publicar'}));
f.onsubmit=async e=>{e.preventDefault();try{await api('api/extra.php?a=activity_new',{json:Object.fromEntries(new FormData(f))});f.reset();flash('Actividad publicada.');lista()}catch(x){flash(x.message,'err')}};$('#nuevo').append(f)}});</script>
</main><footer id="pie"></footer></body></html>
