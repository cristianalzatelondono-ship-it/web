<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inicio · EcoAlerta</title><link rel="stylesheet" href="css/style.css"></head>
<body><a class="skip" href="#c">Saltar al contenido</a><header id="cab"></header><main id="c" class="w">
<section class="hero"><h1>Tu barrio también habla. Escúchalo.</h1><p>Reporta problemas ambientales, mira el mapa y sigue cada caso hasta su solución.</p><a class="btn alert" href="reportar.html">Reportar problema</a> <a class="btn out" href="mapa.html">Ver el mapa</a></section>
<h2>¿Qué puedes reportar?</h2><div class="grid" id="cats"></div>
<h2>Impacto real</h2><div class="grid" id="cif"></div>
<h2>Reportes recientes</h2><div id="rec"></div>
<script src="js/app.js"></script>
<script>(async()=>{try{
const c=(await api('api/extra.php?a=categories')).categories;c.forEach(x=>$('#cats').append(el('div',{class:'card'},el('span',{class:'ic',text:x.icon}),el('h3',{text:x.name}))));
const s=await api('api/extra.php?a=stats');[[s.total,'reportes'],[s.solved,'solucionados con evidencia'],[s.activities,'actividades']].forEach(([n,t])=>$('#cif').append(el('div',{class:'card'},el('b',{class:'big',text:n}),t)));
const r=(await api('api/reports.php?limit=5')).reports;if(!r.length)$('#rec').append(el('p',{class:'empty',text:'Aún no hay reportes. Crea el primero.'}));
r.forEach(x=>$('#rec').append(el('p',{},x.icon+' ',el('a',{href:'reporte.html?id='+x.id,text:x.title}),' ',badge(x.status))));
}catch(e){flash(e.message,'err')}})();</script>
</main><footer id="pie"></footer></body></html>
