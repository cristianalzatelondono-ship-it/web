<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel · EcoAlerta</title><link rel="stylesheet" href="css/style.css"></head>
<body><a class="skip" href="#c">Saltar al contenido</a><header id="cab"></header><main id="c" class="w">
<h1>Panel de moderación</h1>
<form id="f" class="filters"><select name="s" id="s1" aria-label="Estado"><option value="">Todos los estados</option></select><input name="q" placeholder="Buscar" aria-label="Buscar"><button class="btn">Filtrar</button></form>
<table><thead><tr><th>#</th><th>Título</th><th>Categoría</th><th>Autor</th><th>Estado</th><th>Fecha</th><th>Acción</th></tr></thead><tbody id="t"></tbody></table><div id="u"></div>
<script src="js/app.js"></script>
<script>ready.then(async me=>{if(!me||me.role==='ciudadano')return location='login.html';Object.entries(ST).forEach(([k,v])=>$('#s1').append(el('option',{value:k,text:v})));$('#s1').value='pendiente';
function acc(x){const t=el('td');if(['pendiente','en_revision'].includes(x.status)){const a=el('button',{class:'btn sm',text:'Aceptar'}),r=el('button',{class:'btn sm out2',text:'Rechazar'});const go=async(s,n)=>{try{await api('api/reports.php?a=status',{json:{id:x.id,status:s,note:n}});cargar()}catch(e){flash(e.message,'err')}};a.onclick=()=>go('validado','Verificado por moderación');r.onclick=()=>{const n=prompt('Motivo del rechazo (mínimo 10 caracteres):');if(n)go('rechazado',n)};t.append(a,' ',r)}return t}
async function cargar(){const q=new URLSearchParams(new FormData($('#f')));q.set('all','1');try{const r=(await api('api/reports.php?'+q)).reports;$('#t').replaceChildren(...r.map(x=>el('tr',{},el('td',{text:x.id}),el('td',{},el('a',{href:'reporte.html?id='+x.id,text:x.title})),el('td',{text:x.cat}),el('td',{text:x.author}),el('td',{},badge(x.status)),el('td',{text:x.created_at}),acc(x))))}catch(e){flash(e.message,'err')}}
$('#f').onsubmit=e=>{e.preventDefault();cargar()};cargar();
if(me.role==='administrador'){const us=(await api('api/extra.php?a=users')).users;$('#u').append(el('h2',{text:'Usuarios y roles'}),el('table',{},...us.map(x=>{const s=el('select',{'aria-label':'Rol'},...['ciudadano','moderador','administrador'].map(o=>{const p=el('option',{text:o});if(o===x.role)p.selected=true;return p}));
const b=el('button',{class:'btn sm',text:'Guardar'});b.onclick=async()=>{try{await api('api/extra.php?a=role',{json:{id:x.id,role:s.value}});flash('Rol actualizado.')}catch(e){flash(e.message,'err')}};const r2=el('button',{class:'btn sm out2',text:'Nueva clave'});r2.onclick=async()=>{if(!confirm('¿Generar una contraseña temporal para '+x.name+'?'))return;try{const d=await api('api/extra.php?a=reset',{json:{id:x.id}});alert('Contraseña temporal (entrégala a la persona): '+d.temp)}catch(e){flash(e.message,'err')}};return el('tr',{},el('td',{text:x.name}),el('td',{text:x.email}),el('td',{},s,' ',b,' ',r2))})))}});</script>
</main><footer id="pie"></footer></body></html>
